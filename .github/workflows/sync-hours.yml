name: Sync Hours Ledger

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log the changes without writing to Notion"
        type: boolean
        default: false
  schedule:
    # Safety net only. If the loop below ever dies, this restarts it.
    - cron: "0 */6 * * *"

concurrency:
  group: sync-hours
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync every 30 seconds
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Stop at 5h40m, safely inside the 6-hour job limit.
          END=$(( SECONDS + 20400 ))
          while [ "$SECONDS" -lt "$END" ]; do
            python scripts/sync_hours.py || echo "sync failed, continuing"
            sleep 30
          done

      - name: Start the next shift
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-hours.yml
