name: Notion → Telegram notifier

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Each run polls Notion every minute for LOOP_MINUTES minutes, so back-to-back
# runs give ~1-minute notification latency around the clock.
concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run notifier
        run: python bot.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TEAM_MAP: ${{ secrets.TEAM_MAP }}
          LOOP_MINUTES: "28"
